<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Tailwind UI Demo</title>
        <!-- Tailwind CSS via CDN -->
        <script src="https://cdn.tailwindcss.com"></script>
    </head>

    <body class="bg-gray-100">
        <!-- Navbar -->
        <nav class="bg-indigo-600 text-white p-4 shadow-lg">
            <div class="container mx-auto flex justify-between items-center">
                <h1 class="text-2xl font-bold">MyApp</h1>
                <div class="space-x-4">
                    <a href="#" class="hover:text-indigo-200">Home</a>
                    <a href="#" class="hover:text-indigo-200">About</a>
                    <a href="#" class="hover:text-indigo-200">Contact</a>
                </div>
            </div>
        </nav>

        <!-- Cards Grid -->
        <div class="container mx-auto p-6">
            <h2 class="text-3xl font-bold text-gray-800 mb-6">Our Products</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Card 1 -->
                <div class="bg-white rounded-xl shadow-md overflow-hidden hover:shadow-xl transition-shadow">
                    <div class="h-40 bg-gradient-to-r from-cyan-500 to-blue-500"></div>
                    <div class="p-6">
                        <h3 class="text-xl font-semibold mb-2">Basic Plan</h3>
                        <p class="text-gray-600 mb-4">Perfect for getting started with our platform.</p>
                        <p class="text-3xl font-bold text-indigo-600 mb-4">$9<span
                                class="text-lg text-gray-500">/mo</span></p>
                        <button
                            class="w-full bg-indigo-600 text-white py-2 rounded-lg hover:bg-indigo-700 transition">Choose
                            Plan</button>
                    </div>
                </div>
                <!-- Card 2 -->
                <div
                    class="bg-white rounded-xl shadow-md overflow-hidden hover:shadow-xl transition-shadow ring-2 ring-indigo-500">
                    <div class="h-40 bg-gradient-to-r from-purple-500 to-pink-500 relative">
                        <span
                            class="absolute top-2 right-2 bg-yellow-400 text-xs font-bold px-2 py-1 rounded-full">Popular</span>
                    </div>
                    <div class="p-6">
                        <h3 class="text-xl font-semibold mb-2">Pro Plan</h3>
                        <p class="text-gray-600 mb-4">Advanced features for professionals.</p>
                        <p class="text-3xl font-bold text-indigo-600 mb-4">$29<span
                                class="text-lg text-gray-500">/mo</span></p>
                        <button
                            class="w-full bg-indigo-600 text-white py-2 rounded-lg hover:bg-indigo-700 transition">Choose
                            Plan</button>
                    </div>
                </div>
                <!-- Card 3 -->
                <div class="bg-white rounded-xl shadow-md overflow-hidden hover:shadow-xl transition-shadow">
                    <div class="h-40 bg-gradient-to-r from-green-500 to-teal-500"></div>
                    <div class="p-6">
                        <h3 class="text-xl font-semibold mb-2">Enterprise</h3>
                        <p class="text-gray-600 mb-4">Custom solutions for large teams.</p>
                        <p class="text-3xl font-bold text-indigo-600 mb-4">$99<span
                                class="text-lg text-gray-500">/mo</span></p>
                        <button
                            class="w-full bg-indigo-600 text-white py-2 rounded-lg hover:bg-indigo-700 transition">Choose
                            Plan</button>
                    </div>
                </div>
            </div>
        </div>
    </body>

</html>
